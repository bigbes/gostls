name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Track the go directive in go.mod (currently 1.25, required by x/crypto).
          go-version-file: go.mod

      # gostls is pure-Go and BSD-2-Clause. gostcrypto is pinned by version in
      # go.mod (no replace), so it resolves from the module proxy. The cgo
      # OpenSSL backend lives in the separate go-tlsdialer module, not here.
      - name: build (pure-Go / CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...

      - name: vet
        run: CGO_ENABLED=0 go vet ./...

      - name: test
        run: CGO_ENABLED=0 go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Enforce the zero-issue golangci-lint gate (.golangci.yml, default: all).
      # Pinned to the same v2 release used in development for reproducibility.
      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Short mutation pass over the attacker-facing wire-parser fuzz targets
      # (the seed corpus is already replayed by `go test` in the build job).
      - name: fuzz smoke (each target, short)
        run: make fuzz FUZZTIME=20s FUZZMINTIME=2s

  # Real GOST TLS interop: the pure-Go client handshakes against an OpenSSL
  # s_server driven by the GOST engine (build-tagged `gostengine`; skips locally
  # when the engine is absent, but here the engine is built so it must run).
  gost-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-gost-engine
      - name: gost-engine interop (TestGOSTEngineInterop)
        run: CGO_ENABLED=0 go test -tags gostengine -run TestGOSTEngineInterop -count=1 ./...
