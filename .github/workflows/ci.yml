name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # gostcrypto is wired in by `replace ../gostcrypto`, so it must be
      # checked out as a sibling directory next to this module.
      - uses: actions/checkout@v4
        with:
          path: gostls
      - uses: actions/checkout@v4
        with:
          repository: bigbes/gostcrypto
          path: gostcrypto
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # gostls is pure-Go and BSD-2-Clause. The cgo OpenSSL backend lives in
      # the separate go-tlsdialer module, not here.
      - name: build (pure-Go / CGO_ENABLED=0)
        working-directory: gostls
        run: CGO_ENABLED=0 go build ./...

      - name: vet
        working-directory: gostls
        run: CGO_ENABLED=0 go vet ./...

      - name: test
        working-directory: gostls
        run: CGO_ENABLED=0 go test ./...
